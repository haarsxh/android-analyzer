{% extends "base.html" %}
{% block title %}Sign up — Android Analyzer{% endblock %}
{% block content %}
<div class="card" style="max-width:380px; margin: var(--space-xxl) auto; padding: var(--space-xxl) var(--space-xl);">
  <h2 style="margin-top:0; text-align:center">Create an account</h2>
  <form method="post">
    <p>
      <label style="display:block; font-size:13px; color: var(--color-ink-muted-48); margin-bottom:4px;">Username</label>
      <input type="text" name="username" value="{{ username or '' }}" required autofocus style="width:100%; border-radius: var(--radius-pill);">
    </p>
    <p>
      <label style="display:block; font-size:13px; color: var(--color-ink-muted-48); margin-bottom:4px;">Password</label>
      <input type="password" name="password" required minlength="8" style="width:100%; border-radius: var(--radius-pill);">
    </p>
    <p>
      <label style="display:block; font-size:13px; color: var(--color-ink-muted-48); margin-bottom:4px;">Confirm password</label>
      <input type="password" name="confirm" required minlength="8" style="width:100%; border-radius: var(--radius-pill);">
    </p>
    <button class="btn" type="submit" style="width:100%; margin-top: var(--space-sm)">Sign up</button>
  </form>
  <p style="text-align:center; font-size:13px; margin-top: var(--space-md); color: var(--color-ink-muted-48)">
    Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
  </p>
</div>
{% endblock %}
